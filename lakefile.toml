name = "PolyhedralGeometry"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["PolyhedralGeometry"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.27.0"

[[require]]
name = "LinearAlgebraHelpers"
path = "../lean-linear-algebra-helpers"

[[lean_lib]]
name = "PolyhedralGeometry"
